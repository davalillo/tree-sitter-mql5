name: Update Dependencies
on:
  schedule:
    - cron: "0 6 * * MON" # every monday at midnight
  workflow_dispatch:
permissions:
  contents: write # push the update-cpp-parser branch
  pull-requests: write # create the pull request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Update CPP parser
        run: npm update tree-sitter-cpp
      - name: Regenerate Source Files
        run: npm run generate
      - name: Install parser sources (node-gyp)
        run: npm install
      - name: Run tests
        run: |
          git submodule update --init
          # Copy only top-level corpus files; upstream added test/corpus/c/ (a directory)
          # which makes plain `cp` exit 1 (and -r would run the new C corpus, where the
          # mql5 grammar still fails one test: c/declarations.txt :: Typedefs).
          cp tree-sitter-cpp/test/corpus/*.txt test/corpus/
          npm test
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          body: Update dependencies and regenerate CPP parser
          branch: update-cpp-parser
          commit-message: Update dependencies and regenerate CPP parser
          title: Update CPP parser
